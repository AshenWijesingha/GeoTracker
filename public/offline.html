<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050510">
  <title>GeoTracker — Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #050510; color: #e0e0e0; font-family: 'Courier New', monospace; padding: 16px; box-sizing: border-box; }
    .card { max-width: 420px; border: 1px solid rgba(0,255,136,.3); border-radius: 8px; padding: 28px; text-align: center;
      background: rgba(10,10,26,.95); box-shadow: 0 0 30px rgba(0,255,136,.15); }
    h1 { color: #00ff88; font-size: 20px; letter-spacing: 2px; text-transform: uppercase; }
    p { color: #aaa; line-height: 1.6; font-size: 14px; }
    button { margin-top: 12px; background: linear-gradient(135deg,#00ff88,#00ccff); color: #050510; border: 0;
      padding: 12px 24px; border-radius: 4px; font-weight: bold; cursor: pointer; min-height: 44px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📡 You are offline</h1>
    <p>This page hasn't been cached yet and there is no connection. Pages you opened before still work offline,
      and location updates recorded while offline are synced automatically once you reconnect.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
